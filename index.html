<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>体質レシピ相談</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>体質レシピ相談</h1>
        <p>今の体調を送ると、体質に合うレシピを提案します</p>
      </header>

      <main id="chat-history" class="chat-history" aria-live="polite"></main>

      <div class="quick-questions" id="quick-questions">
        <button type="button" class="quick-btn" data-message="冷えやすい">冷えやすい</button>
        <button type="button" class="quick-btn" data-message="疲れが取れない">疲れが取れない</button>
        <button type="button" class="quick-btn" data-message="胃腸が弱い">胃腸が弱い</button>
        <button type="button" class="quick-btn" data-message="むくみやすい">むくみやすい</button>
      </div>

      <div class="error-hint" id="error-hint">体調や気になることを書いてください</div>

      <footer class="input-bar">
        <form id="chat-form" class="chat-form">
          <input
            type="text"
            id="message-input"
            class="message-input"
            placeholder="体調や気になることを入力…"
            autocomplete="off"
            enterkeyhint="send"
          />
          <button type="submit" id="send-button" class="send-button">送信</button>
        </form>
      </footer>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
